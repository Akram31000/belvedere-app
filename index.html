 for(let i=0;i<n;i++)h+=`<th data-hp="${i}" class="${i==S.p?"cur":""}">${lab(i)}</th>`;
 h+="</tr></thead><tbody>";
 ts.forEach(ti=>{h+=`<tr class="tr"><td colspan="${n+2}">Tronçon ${ti+1}</td></tr>`;D.t[ti].p.forEach((pl,pi)=>{const k=ti+"."+pi,c=pl[0],r=D.r[pl[1]];
  h+=`<tr data-k="${k}"><td class="s1">${pi+1}</td><td class="s2"><span class="cd ${cat(c)}" title="${D.c[c]||""}">${c}</span>${r?` <small>${r}</small>`:""}</td>`;
  for(let i=0;i<n;i++)h+=`<td data-p="${i}" class="${i==S.p?"cur":""}${g(i,k)!==undefined?" fl":""}">${cellHtml(i,k)}</td>`;h+="</tr>"})});
 $("#gr").innerHTML=h+"</tbody></table></div>";
 const w=$(".gw");w.style.maxHeight=Math.max(220,innerHeight-document.querySelector("header").offsetHeight-$("#gr .hint").offsetHeight-34)+"px";w.scrollTop=st[0];w.scrollLeft=st[1];
 const e=$("#ei");if(e){e.focus();e.select();e.scrollIntoView({block:"nearest",inline:"nearest"})}
}
function gcommit(txt,esc){const{p,k}=E;
 if(!esc){const t=txt.trim();if(t==="-"||t==="∅")put(k,"∅",p);else if(t)put(k,norm(t),p);else{const pr=prop(k,p);if(pr)put(k,pr,p)}}
 const rows=[...$("#gr").querySelectorAll("tr[data-k]")].map(r=>r.dataset.k),i=rows.indexOf(k);
 E=esc||i<0||i+1>=rows.length?null:{p,k:rows[i+1]};render()}
$("#gr").addEventListener("click",e=>{
 const th=e.target.closest("th[data-hp]");if(th){S.p=+th.dataset.hp;E=null;save();render();return}
 const td=e.target.closest("td[data-p]");if(!td||e.target.id=="ei")return;
 const ei=$("#ei");if(ei&&E){const t=ei.value.trim();if(t)put(E.k,t==="-"?"∅":norm(t),E.p)}
 E={p:+td.dataset.p,k:td.parentElement.dataset.k};render()});
$("#gr").addEventListener("keydown",e=>{if(e.target.id!=="ei"||!E)return;if(e.key==="Enter")gcommit(e.target.value);else if(e.key==="Escape")gcommit("",true)});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const seq=T=>{const o=[];T.p.forEach(p=>{const l=o[o.length-1];l&&l[0]==p[0]?l[1]++:o.push([p[0],1])});return o.map(([c,n])=>n>1?c+"x"+n:c).join(", ")};
const CODES=()=>Object.keys(D.c).map(Number).sort((a,b)=>a-b);
const opt=sel=>CODES().map(c=>`<option value="${c}"${c==sel?" selected":""}>${c} · ${esc(D.c[c])}</option>`).join("");
const ruei=r=>{r=(r||"").trim();let i=D.r.indexOf(r);if(i<0){D.r.push(r);i=D.r.length-1}return i};
function remap(fn){for(const p in S.d){const n={};for(const k in S.d[p]){const[a,b]=k.split(".").map(Number),m=fn(a,b);if(m)n[m[0]+"."+m[1]]=S.d[p][k]}S.d[p]=n}}
const cf=(b,fn)=>{if(b.dataset.arm){fn();return}b.dataset.arm=1;const o=b.textContent;b.textContent="Confirmer ?";setTimeout(()=>{b.dataset.arm="";b.textContent=o},4000)};
function admin(){const T=D.t[S.t];
 const pl=T.p.map((p,i)=>`<div class="pl"><b>${i+1}</b><select data-c="${i}">${opt(p[0])}</select><input data-n="${i}" value="${esc(D.r[p[1]]||"")}" placeholder="Rue / note (facultatif)"><button data-del="${i}" title="Supprimer cette place">✕</button></div>`).join("");
 $("#am").innerHTML=`<h3>Création du tableau</h3>
 <label style="display:flex">Nom du relevé<input id="an" value="${esc(D.name)}"></label>
 <label style="display:flex">Nombre de places de chaque tronçon (un nombre par tronçon, séparés par des virgules)<input id="a1" value="${D.t.map(t=>t.p.length).join(", ")}"></label><p class="hint" style="margin-top:0">Ex. « 22, 16, 1, 6 » crée 4 tronçons de 22, 16, 1 et 6 places. Les codes se règlent ensuite tronçon par tronçon.</p>
 <div><label>Code par défaut des places<select id="a3">${opt(10)}</select></label></div>
 <button class="p" id="agen">Générer un tableau neuf</button><p class="hint">Remplace toute la structure et efface les saisies. Tronçons et places sont numérotés automatiquement (1, 2, 3…), puis modifiables ci-dessous.</p>
 <h3>Tronçon ${S.t+1} — ${T.p.length} place${T.p.length>1?"s":""} (choisir un autre tronçon avec les puces)</h3>
 <div><label>Ajouter<input id="b1" type="number" min="1" max="100" value="5"></label><label>places de code<select id="b2">${opt(10)}</select></label><button id="badd">+ Ajouter</button></div>
 <div><label>Places de<input id="r1" type="number" min="1" value="1"></label><label>à<input id="r2" type="number" min="1" value="${T.p.length||1}"></label><label>Code<select id="r3">${opt(10)}</select></label><button id="rap">Appliquer le code</button></div>
 <label style="display:flex;margin-top:6px">Code de chaque place, dans l’ordre (« 10x5 » = 5 places de code 10). Modifier cette ligne change aussi le nombre de places.<input id="sq" value="${esc(seq(T))}"></label><button id="sqb">Appliquer les codes</button>
 <div style="margin-top:8px">${pl||'<p class="hint">Aucune place : utilisez « Ajouter ».</p>'}</div>
 <div class="acts" style="margin-top:8px"><button id="tadd">+ Nouveau tronçon</button><button id="tdel">Supprimer ce tronçon</button></div>
 <h3>Codes de réglementation</h3><p class="hint">${CODES().map(c=>c+" = "+esc(D.c[c])).join(" · ")}</p>
 <div><label>N° du code<input id="ac1" type="number" min="0" value="${Math.max(...CODES())+1}"></label><label>Libellé<input id="ac2" placeholder="ex. PMR"></label><button id="acd">Ajouter / modifier</button></div>
 <h3>Partager la structure</h3><p class="hint">Copiez ce code pour reproduire le même tableau sur un autre appareil (le coller là-bas puis « Appliquer »).</p>
 <textarea id="aj" rows="4">${esc(JSON.stringify(D))}</textarea><button id="aap">Appliquer ce code</button><p class="hint" id="amsg"></p>`}
$("#am").addEventListener("change",e=>{const t=e.target,T=D.t[S.t];
 if(t.id=="an"){D.name=t.value;saveD();render()}
 else if(t.dataset.c!==undefined){T.p[+t.dataset.c][0]=+t.value;saveD();render()}
 else if(t.dataset.n!==undefined){T.p[+t.dataset.n][1]=ruei(t.value);saveD()}});
$("#am").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const T=D.t[S.t],v=id=>+$("#"+id).value;
 if(b.dataset.del!==undefined){const i=+b.dataset.del;T.p.splice(i,1);remap((a,p)=>a!=S.t?[a,p]:p==i?null:[a,p>i?p-1:p]);saveD();save();render()}
 else if(b.id=="badd"){for(let i=0;i<v("b1");i++)T.p.push([v("b2"),0]);saveD();render()}
 else if(b.id=="rap"){for(let i=v("r1")-1;i<Math.min(v("r2"),T.p.length);i++)T.p[i][0]=v("r3");saveD();render()}
 else if(b.id=="sqb"){const codes=[];let ok=true;$("#sq").value.split(/[,;\s]+/).filter(Boolean).forEach(t=>{const m=t.match(/^(\d+)(?:x(\d+))?$/i);if(!m){ok=false;return}for(let i=0;i<(+m[2]||1);i++)codes.push(+m[1])});if(!ok||codes.length>500){$("#sq").style.borderColor="#dc2626";return}const L=codes.length;remap((a,p)=>a!=S.t||p<L?[a,p]:null);codes.forEach(c=>{D.c[c]=D.c[c]||"Code "+c});T.p=codes.map((c,i)=>[c,T.p[i]?T.p[i][1]:0]);saveD();save();render()}
 else if(b.id=="tadd"){D.t.push({p:[]});S.t=D.t.length-1;saveD();save();render()}
 else if(b.id=="tdel"){cf(b,()=>{if(D.t.length<2)return;const x=S.t;D.t.splice(x,1);remap((a,p)=>a==x?null:[a>x?a-1:a,p]);S.t=Math.max(0,x-1);saveD();save();render()})}
 else if(b.id=="agen"){cf(b,()=>{const c=v("a3"),ns=$("#a1").value.split(/[,;\s]+/).filter(Boolean).map(x=>Math.max(0,Math.min(300,parseInt(x)||0)));if(!ns.length)return;D.t=ns.map(m=>({p:Array.from({length:m},()=>[c,0])}));S.d={};S.t=0;S.p=0;saveD();save();render()})}
 else if(b.id=="acd"){const c=v("ac1"),l=$("#ac2").value.trim();if(l&&c>=0){D.c[c]=l;saveD();render()}}
 else if(b.id=="aap"){cf(b,()=>{try{const x=JSON.parse($("#aj").value);if(!Array.isArray(x.t)||!x.t.length||!Array.isArray(x.r)||!x.c)throw 0;D=x;D.r[0]=D.r[0]||"";D.name=D.name||"Relevé";S.d={};S.t=0;S.p=0;saveD();save();render()}catch(_){$("#amsg").textContent="Code invalide."}})}});
addEventListener("resize",()=>{if(S.v=="g")grid()});
render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
